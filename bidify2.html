// ── DB HELPERS ───────────────────────────────────────────────
const sbDB = {
  // Profili
  getProfile: async id => {
    const {
      data,
      error
    } = await getSB().from('profiles').select('*').eq('id', id).single();
    return {
      data,
      error
    };
  },
  updateProfile: async (id, updates) => {
    const {
      data,
      error
    } = await getSB().from('profiles').update(updates).eq('id', id);
    return {
      data,
      error
    };
  },
  // Aste
  getAuctions: async (filters = {}) => {
    let q = getSB().from('auctions').select('*');
    if (filters.status) q = q.in('status', filters.status);
    if (filters.categoria) q = q.eq('categoria', filters.categoria);
    const {
      data,
      error
    } = await q.order('created_at', {
      ascending: false
    });
    return {
      data: data || [],
      error
    };
  },
  createAuction: async auction => {
    const {
      data,
      error
    } = await getSB().from('auctions').insert(auction).select().single();
    return {
      data,
      error
    };

    const {
      data,

// ── REALTIME HELPERS ─────────────────────────────────────────
const sbRealtime = {
  onBids: (auctionId, cb) => {
    return getSB().channel(`bids:${auctionId}`).on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'bids',
      filter: `auction_id=eq.${auctionId}`
    }, cb).subscribe();
  },
  onGaraSession: (auctionId, cb) => {
    return getSB().channel(`gara:${auctionId}`).on('postgres_changes', {
      event: '*',
      schema: 'public',
      table: 'gara_sessions',
      filter: `auction_id=eq.${auctionId}`
    }, cb).subscribe();
  },
  onMessages: (auctionId, cb) => {
    return getSB().channel(`msgs:${auctionId}`).on('postgres_changes', {
      event: 'INSERT',
      schema: 'public',
      table: 'gara_messages',
      filter: `auction_id=eq.${auctionId}`
    }, cb).subscribe();
  },
  unsubscribe: channel => {
    if (channel) getSB().removeChannel(channel);
  }
};
const ROYALTY_MOBILE = 8; // Commissione beni MOBILI (%) — a carico acquirente

// Commissione IMMOBILI per fascia di prezzo (aggiornabile dall'admin)
const FASCE_IMMOBILE = [{
  max: 100000,
  pct: 4.0,
  label: "fino a € 100.000"
}, {
  max: 250000,
  pct: 3.5,
  label: "€ 100.001 – 250.000"
}, {
  max: 500000,
  pct: 3.0,
  label: "€ 250.001 – 500.000"
}, {
  max: 1000000,
  pct: 2.5,
  label: "€ 500.001 – 1.000.000"
}, {
  max: Infinity,
  pct: 2.0,
  label: "oltre € 1.000.000"
}];

// Helper: restituisce % per immobili in base al prezzo
const getRoyaltyImmobile = price => {
  const p = parseFloat(price) || 0;
  const fascia = FASCE_IMMOBILE.find(f => p <= f.max);
  return fascia ? fascia.pct : 2.0;
};

// Helper generale
const getRoyalty = (cat, price) => cat === "Immobili" ? getRoyaltyImmobile(price) : ROYALTY_MOBILE;

// ── CAUZIONE ──────────────────────────────────────────────────────────────────
// Modalità: "pct" = percentuale sul prezzo base | "fixed" = importo fisso
// ── SERVIZIO FOTOGRAFICO & VIRTUAL TOUR (configurabile da admin) ──────────────
const FOTO_SERVICE_ENABLED = true; // abilita/disabilita il servizio
const FOTO_IMMOBILE_PRICE = 350; // € servizio foto + video immobili
const VIRTUAL_TOUR_PRICE = 490; // € virtual tour 3D Matterport
const FOTO_BUNDLE_PRICE = 750; // € bundle foto immobile + virtual tour

const CAUZIONE_MODE = "pct"; // "pct" | "fixed"
const CAUZIONE_PCT = 10; // % sul prezzo base (standard aste italiane)
const CAUZIONE_FIXED = 500; // € importo fisso alternativo
// Helper: calcola cauzione
const calcCauzione = price => {
  const p = parseFloat(price) || 0;
  if (!p) return 0;
  return CAUZIONE_MODE === "pct" ? Math.round(p * CAUZIONE_PCT / 100) : CAUZIONE_FIXED;
};
const cauzioneLabel = () => CAUZIONE_MODE === "pct" ? `${CAUZIONE_PCT}% del prezzo base` : `€ ${CAUZIONE_FIXED.toLocaleString("it")} fissi`;
